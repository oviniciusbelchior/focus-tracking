<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Entrar · Focus Tracking</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--side:#0b0b0c;--fg:#111113;--muted:#55565c;--faint:#8a8b91;--line:#e1e1e5;--brand:#ff5a1f;--brand-soft:#fff1ea;--bg:#ffffff;--panel:#f7f6f5}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:10px}
.left{display:flex;flex-direction:column;padding:28px 38px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.logo i{width:34px;height:34px;border-radius:9px;background:var(--side);display:grid;place-items:center}
.logo i:after{content:"";width:15px;height:15px;border-radius:3px;background:var(--brand)}
.logo b{font-size:21px;letter-spacing:-.3px}
.logo small{display:block;font-size:9.5px;letter-spacing:2px;color:var(--faint);text-transform:uppercase;margin-top:-2px}
.help{color:var(--muted);font-weight:700;font-size:14px;text-decoration:none}
.help:hover{color:var(--fg)}
.form-area{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 0}
form{width:100%;max-width:400px;display:flex;flex-direction:column}
h1{font-size:28px;margin:0;text-align:center;letter-spacing:-.4px}
.sub{color:var(--muted);text-align:center;margin:6px 0 30px}
label{font-size:13.5px;font-weight:700;margin-bottom:7px;display:block}
.lrow{display:flex;justify-content:space-between;align-items:baseline}
.lrow a{font-size:13.5px;color:var(--brand);text-decoration:none;font-weight:700}
.lrow a:hover{text-decoration:underline}
.inp{width:100%;font:inherit;font-size:15px;padding:13px 18px;border:1px solid #cfcfd4;border-radius:999px;background:#fff;color:var(--fg);outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,90,31,.15)}
.f{margin-bottom:20px}
.pw{position:relative}
.pw .inp{padding-right:52px}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.eye:hover{background:#f2f2f4;color:var(--fg)}
.btn{margin-top:14px;border:0;border-radius:999px;background:var(--side);color:#fff;font:inherit;font-weight:700;font-size:15px;padding:15px;cursor:pointer;box-shadow:0 10px 24px rgba(11,11,12,.18);transition:background .15s,transform .05s}
.btn:hover{background:#222226}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.7;cursor:default}
.err{background:#fff4ed;color:#c2410c;font-size:13.5px;padding:10px 14px;border-radius:10px;margin-bottom:16px}
.err.ok{background:#ecfdf3;color:#067647}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid #cfcfd4;border-radius:999px;background:#fff;font:inherit;font-weight:700;font-size:15px;padding:13px;cursor:pointer;color:var(--fg)}
.gbtn:hover{background:#f7f7f8}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12.5px;margin:22px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.alt{text-align:center;font-size:14px;color:var(--muted);margin-top:22px}
.alt a{color:var(--brand);font-weight:700;text-decoration:none}
.foot{text-align:center;font-size:11.5px;letter-spacing:2.5px;color:var(--faint);text-transform:uppercase}
.foot b{color:var(--muted);font-weight:700}

.right{border-radius:22px;background:radial-gradient(120% 80% at 85% 0%,#fff 0%,rgba(255,255,255,0) 55%),radial-gradient(90% 70% at 10% 100%,var(--brand-soft) 0%,rgba(255,241,234,0) 60%),var(--panel);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px 130px}
.icon{width:210px;height:210px;border-radius:44px;background:linear-gradient(160deg,#1c1c1f,#0b0b0c);display:grid;place-items:center;box-shadow:0 30px 60px rgba(255,90,31,.22),0 10px 24px rgba(11,11,12,.25),inset 0 1px 0 rgba(255,255,255,.08)}
.icon i{width:92px;height:92px;border-radius:20px;background:var(--brand);box-shadow:0 0 50px rgba(255,90,31,.55)}
.tag{font-size:25px;line-height:1.3;color:#3a3b40;text-align:center;margin:34px 0 0;letter-spacing:-.3px}
.tag b{color:var(--fg)}
.steps{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);display:flex;align-items:flex-start}
.st{display:flex;flex-direction:column;align-items:center;gap:8px;width:100px;font-size:13.5px;color:var(--muted)}
.st span{width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--brand);box-shadow:0 2px 8px rgba(11,11,12,.07)}
.st.on span{background:var(--brand);color:#fff;box-shadow:0 8px 18px rgba(255,90,31,.35)}
.st.on{color:var(--fg);font-weight:700}
.ln{width:34px;height:2px;background:linear-gradient(90deg,#f3c3ad,var(--brand));margin-top:21px}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);padding:0}
  .right{display:none}
  .left{padding:22px 16px;min-height:100vh}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="left">
    <div class="top">
      <a class="logo" href="/login"><i></i><span><b>Focus Tracking</b><small>Rastreio de WhatsApp</small></span></a>
      <a class="help" href="https://wa.me/?text=Preciso%20de%20ajuda%20com%20o%20Focus%20Tracking" target="_blank" rel="noopener">Preciso de ajuda</a>
    </div>
    <div class="form-area">
      <form id="f" novalidate>
        <h1 id="ttl">Entrar</h1>
        <p class="sub" id="subt">Veja de onde vem cada conversa do seu WhatsApp.</p>
        <div class="err" id="err" hidden></div>
        <div id="gwrap"><button class="gbtn" type="button" id="google"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Entrar com Google</button>
        <div class="or">ou com e-mail</div></div>
        <div class="f" id="fmail"><label for="email">E-mail</label><input class="inp" id="email" type="email" autocomplete="email" required></div>
        <div class="f"><div class="lrow"><label for="pass" id="plbl">Senha</label><a href="#" id="forgot">Esqueci minha senha</a></div>
          <div class="pw"><input class="inp" id="pass" type="password" autocomplete="current-password" required minlength="8">
            <button class="eye" type="button" id="eye" aria-label="Mostrar senha"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
        <button class="btn" type="submit" id="go">Entrar</button>
        <p class="alt" id="alt"></p>
      </form>
    </div>
    <div class="foot">Meta Ads · Google Ads · WhatsApp</div>
  </section>
  <aside class="right" aria-hidden="true">
    <div class="icon"><i></i></div>
    <p class="tag">Do primeiro clique<br><b>à venda no WhatsApp.</b></p>
    <div class="steps">
      <div class="st"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4M15 3h4a2 2 0 0 1 2 2v4M9 21H5a2 2 0 0 1-2-2v-4M15 21h4a2 2 0 0 0 2-2v-4M8 12h8"/></svg></span>Conectar</div>
      <div class="ln"></div>
      <div class="st"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></span>Rastrear</div>
      <div class="ln"></div>
      <div class="st on"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg></span>Vender</div>
    </div>
  </aside>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/ft-auth.js"></script>
<script>
(function(){
  var $=function(s){return document.querySelector(s)},err=$("#err"),mode="in";
  var sb=window.supabase&&window.FT_SB?window.supabase.createClient(FT_SB.url,FT_SB.key):null;
  var back=location.origin+"/login";
  function show(t,ok){err.textContent=t||"";err.hidden=!t;err.className="err"+(ok?" ok":"")}
  function busy(on,txt){var b=$("#go");b.disabled=on;b.textContent=on?txt:({in:"Entrar",up:"Criar conta",reset:"Salvar nova senha"})[mode]}
  function setMode(m){mode=m;show("");
    $("#ttl").textContent={in:"Entrar",up:"Criar sua conta",reset:"Nova senha"}[m];
    $("#subt").textContent={in:"Veja de onde vem cada conversa do seu WhatsApp.",up:"Use o e-mail em que você recebeu o convite.",reset:"Escolha a nova senha da sua conta."}[m];
    $("#gwrap").hidden=m==="reset";$("#fmail").hidden=m==="reset";$("#forgot").hidden=m!=="in";
    $("#plbl").textContent=m==="in"?"Senha":"Senha (mínimo 8 caracteres)";
    $("#pass").autocomplete=m==="in"?"current-password":"new-password";
    $("#alt").innerHTML=m==="in"?'Recebeu um convite? <a href="#" data-m="up">Criar conta</a>':m==="up"?'Já tem conta? <a href="#" data-m="in">Entrar</a>':"";
    var a=$("#alt a");if(a)a.onclick=function(e){e.preventDefault();setMode(a.dataset.m)};
    busy(false)}
  function msg(e){var t=(e&&e.message)||"";
    if(/database error|convite_necessario/i.test(t))return "Este e-mail ainda não foi convidado. Peça para o dono da conta te convidar.";
    if(/invalid login/i.test(t))return "E-mail ou senha incorretos.";
    if(/email not confirmed/i.test(t))return "Confirme seu e-mail pelo link que enviamos antes de entrar.";
    if(/already registered/i.test(t))return "Este e-mail já tem conta. Use Entrar.";
    if(/password/i.test(t)&&/least|short|weak/i.test(t))return "A senha precisa ter pelo menos 8 caracteres.";
    if(/rate limit/i.test(t))return "Muitas tentativas. Aguarde alguns minutos e tente de novo.";
    return t||"Não foi possível concluir. Tente de novo."}
  $("#eye").onclick=function(){var p=$("#pass"),on=p.type==="password";p.type=on?"text":"password";this.setAttribute("aria-label",on?"Ocultar senha":"Mostrar senha")};
  var q=new URLSearchParams(location.search);
  if(q.get("email"))$("#email").value=q.get("email");
  setMode(q.get("convite")?"up":"in");
  var hashErr=new URLSearchParams(location.hash.slice(1)).get("error_description")||q.get("error_description");
  if(hashErr)show(msg({message:hashErr}));
  if(!sb){show("Não foi possível carregar o login. Recarregue a página.");return}
  var recovering=/type=recovery/.test(location.hash);
  if(recovering)setMode("reset");
  sb.auth.onAuthStateChange(function(ev,session){
    if(ev==="PASSWORD_RECOVERY"){recovering=true;setMode("reset");return}
    if(session&&!recovering&&(ev==="SIGNED_IN"||ev==="INITIAL_SESSION"))location.replace("/")});
  $("#google").onclick=function(){show("");var gb=this;gb.disabled=true;
    fetch(FT_SB.url+"/auth/v1/settings",{headers:{apikey:FT_SB.key}}).then(function(r){return r.json()}).then(function(st){
      if(st&&st.external&&st.external.google===false){gb.disabled=false;show("O login com Google ainda não foi ativado. Use e-mail e senha por enquanto.");return}
      sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:back}}).then(function(r){gb.disabled=false;if(r.error)show(msg(r.error))})}).catch(function(){gb.disabled=false;show("Não foi possível abrir o login com Google. Tente de novo.")})};
  $("#forgot").onclick=function(e){e.preventDefault();var m=$("#email").value.trim();
    if(!m){show("Digite seu e-mail acima e clique de novo em Esqueci minha senha.");$("#email").focus();return}
    sb.auth.resetPasswordForEmail(m,{redirectTo:back}).then(function(r){if(r.error)show(msg(r.error));else show("Se esse e-mail tiver conta, enviamos um link para criar uma nova senha.",true)})};
  $("#f").onsubmit=function(e){e.preventDefault();var m=$("#email"),p=$("#pass"),em=m.value.trim();
    if(mode!=="reset"&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){show("Digite um e-mail válido.");m.focus();return}
    if(!p.value){show("Digite sua senha.");p.focus();return}
    if(mode!=="in"&&p.value.length<8){show("A senha precisa ter pelo menos 8 caracteres.");p.focus();return}
    show("");
    if(mode==="in"){busy(true,"Entrando…");sb.auth.signInWithPassword({email:em,password:p.value}).then(function(r){if(r.error){show(msg(r.error));busy(false)}})}
    else if(mode==="up"){busy(true,"Criando…");sb.auth.signUp({email:em,password:p.value,options:{emailRedirectTo:back}}).then(function(r){busy(false);
      if(r.error)return show(msg(r.error));
      if(r.data&&r.data.user&&r.data.user.identities&&!r.data.user.identities.length)return show("Este e-mail já tem conta. Use Entrar.");
      if(!r.data.session){setMode("in");show("Conta criada. Enviamos um link de confirmação para "+em+". Depois de confirmar, é só entrar.",true)}})}
    else{busy(true,"Salvando…");sb.auth.updateUser({password:p.value}).then(function(r){if(r.error){show(msg(r.error));busy(false)}else{recovering=false;location.replace("/")}})}};
})();
</script>
</body>
</html>
