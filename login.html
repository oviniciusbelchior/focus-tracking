<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Entrar · Focus Tracking</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--side:#0b0b0c;--fg:#111113;--muted:#55565c;--faint:#8a8b91;--line:#e1e1e5;--brand:#ff5a1f;--brand-soft:#fff1ea;--bg:#ffffff;--panel:#f7f6f5}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:10px}
.left{display:flex;flex-direction:column;padding:28px 38px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.logo i{width:34px;height:34px;border-radius:9px;background:var(--side);display:grid;place-items:center}
.logo i:after{content:"";width:15px;height:15px;border-radius:3px;background:var(--brand)}
.logo b{font-size:21px;letter-spacing:-.3px}
.logo small{display:block;font-size:9.5px;letter-spacing:2px;color:var(--faint);text-transform:uppercase;margin-top:-2px}
.help{color:var(--muted);font-weight:700;font-size:14px;text-decoration:none}
.help:hover{color:var(--fg)}
.form-area{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 0}
form{width:100%;max-width:400px;display:flex;flex-direction:column}
h1{font-size:28px;margin:0;text-align:center;letter-spacing:-.4px}
.sub{color:var(--muted);text-align:center;margin:6px 0 30px}
label{font-size:13.5px;font-weight:700;margin-bottom:7px;display:block}
.lrow{display:flex;justify-content:space-between;align-items:baseline}
.lrow a{font-size:13.5px;color:var(--brand);text-decoration:none;font-weight:700}
.lrow a:hover{text-decoration:underline}
.inp{width:100%;font:inherit;font-size:15px;padding:13px 18px;border:1px solid #cfcfd4;border-radius:999px;background:#fff;color:var(--fg);outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,90,31,.15)}
.f{margin-bottom:20px}
.pw{position:relative}
.pw .inp{padding-right:52px}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.eye:hover{background:#f2f2f4;color:var(--fg)}
.btn{margin-top:14px;border:0;border-radius:999px;background:var(--side);color:#fff;font:inherit;font-weight:700;font-size:15px;padding:15px;cursor:pointer;box-shadow:0 10px 24px rgba(11,11,12,.18);transition:background .15s,transform .05s}
.btn:hover{background:#222226}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.7;cursor:default}
.err{background:#fff4ed;color:#c2410c;font-size:13.5px;padding:10px 14px;border-radius:10px;margin-bottom:16px}
.foot{text-align:center;font-size:11.5px;letter-spacing:2.5px;color:var(--faint);text-transform:uppercase}
.foot b{color:var(--muted);font-weight:700}

.right{border-radius:22px;background:radial-gradient(120% 80% at 85% 0%,#fff 0%,rgba(255,255,255,0) 55%),radial-gradient(90% 70% at 10% 100%,var(--brand-soft) 0%,rgba(255,241,234,0) 60%),var(--panel);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px 130px}
.icon{width:210px;height:210px;border-radius:44px;background:linear-gradient(160deg,#1c1c1f,#0b0b0c);display:grid;place-items:center;box-shadow:0 30px 60px rgba(255,90,31,.22),0 10px 24px rgba(11,11,12,.25),inset 0 1px 0 rgba(255,255,255,.08)}
.icon i{width:92px;height:92px;border-radius:20px;background:var(--brand);box-shadow:0 0 50px rgba(255,90,31,.55)}
.tag{font-size:25px;line-height:1.3;color:#3a3b40;text-align:center;margin:34px 0 0;letter-spacing:-.3px}
.tag b{color:var(--fg)}
.steps{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);display:flex;align-items:flex-start}
.st{display:flex;flex-direction:column;align-items:center;gap:8px;width:100px;font-size:13.5px;color:var(--muted)}
.st span{width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--brand);box-shadow:0 2px 8px rgba(11,11,12,.07)}
.st.on span{background:var(--brand);color:#fff;box-shadow:0 8px 18px rgba(255,90,31,.35)}
.st.on{color:var(--fg);font-weight:700}
.ln{width:34px;height:2px;background:linear-gradient(90deg,#f3c3ad,var(--brand));margin-top:21px}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);padding:0}
  .right{display:none}
  .left{padding:22px 16px;min-height:100vh}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="left">
    <div class="top">
      <a class="logo" href="/login"><i></i><span><b>Focus Tracking</b><small>Rastreio de WhatsApp</small></span></a>
      <a class="help" href="https://wa.me/?text=Preciso%20de%20ajuda%20com%20o%20Focus%20Tracking" target="_blank" rel="noopener">Preciso de ajuda</a>
    </div>
    <div class="form-area">
      <form id="f" novalidate>
        <h1>Entrar</h1>
        <p class="sub">Veja de onde vem cada conversa do seu WhatsApp.</p>
        <div class="err" id="err" hidden></div>
        <div class="f"><label for="email">E-mail</label><input class="inp" id="email" type="email" autocomplete="email" required></div>
        <div class="f"><div class="lrow"><label for="pass">Senha</label><a href="#" id="forgot">Esqueci minha senha</a></div>
          <div class="pw"><input class="inp" id="pass" type="password" autocomplete="current-password" required>
            <button class="eye" type="button" id="eye" aria-label="Mostrar senha"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
        <button class="btn" type="submit" id="go">Entrar</button>
      </form>
    </div>
    <div class="foot">Meta Ads · Google Ads · WhatsApp</div>
  </section>
  <aside class="right" aria-hidden="true">
    <div class="icon"><i></i></div>
    <p class="tag">Do primeiro clique<br><b>à venda no WhatsApp.</b></p>
    <div class="steps">
      <div class="st"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4M15 3h4a2 2 0 0 1 2 2v4M9 21H5a2 2 0 0 1-2-2v-4M15 21h4a2 2 0 0 0 2-2v-4M8 12h8"/></svg></span>Conectar</div>
      <div class="ln"></div>
      <div class="st"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></span>Rastrear</div>
      <div class="ln"></div>
      <div class="st on"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg></span>Vender</div>
    </div>
  </aside>
</div>
<script>
(function(){
  var $=function(s){return document.querySelector(s)},err=$("#err");
  function show(t){err.textContent=t;err.hidden=!t}
  $("#eye").onclick=function(){var p=$("#pass"),on=p.type==="password";p.type=on?"text":"password";this.setAttribute("aria-label",on?"Ocultar senha":"Mostrar senha")};
  $("#forgot").onclick=function(e){e.preventDefault();var m=$("#email").value.trim();show(m?"Se esse e-mail tiver conta, enviaremos um link para criar uma nova senha.":"Digite seu e-mail acima e clique de novo em Esqueci minha senha.");if(!m)$("#email").focus()};
  $("#f").onsubmit=function(e){e.preventDefault();var m=$("#email"),p=$("#pass");
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m.value.trim())){show("Digite um e-mail válido.");m.focus();return}
    if(!p.value){show("Digite sua senha.");p.focus();return}
    show("");var b=$("#go");b.disabled=true;b.textContent="Entrando…";
    // Protótipo: ainda não há contas. O login de verdade entra com o Supabase Auth.
    setTimeout(function(){location.href="/"},700)};
})();
</script>
</body>
</html>
